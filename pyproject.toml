[tool.poetry]
name = "marketplace-trust"
version = "0.1.0"
description = "ML system for detecting suspicious marketplace behavior"
authors = ["Marketplace Trust Team"]
readme = "README.md"
packages = [{include = "marketplace_trust", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pandas = "^2.2"
numpy = "^1.26"
scikit-learn = "^1.5"
xgboost = "^2.0"
lightgbm = "^4.3"
shap = "^0.45"
pydantic = "^2.7"
pydantic-settings = "^2.3"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
mlflow = "^2.14"
matplotlib = "^3.9"
seaborn = "^0.13"
plotly = "^5.22"
streamlit = "^1.36"
networkx = "^3.3"
pyyaml = "^6.0"
python-dotenv = "^1.0"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
